<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 124 72" role="img" aria-label="Amazon Vision">
  <defs>
    <radialGradient id="iris" cx="45%" cy="40%" r="60%">
      <stop offset="0" stop-color="#8DB07A"/>
      <stop offset=".55" stop-color="#4F7C4A"/>
      <stop offset="1" stop-color="#22432F"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" x2="1">
      <stop offset="0" stop-color="#C9A55E"/>
      <stop offset=".5" stop-color="#A8823A"/>
      <stop offset="1" stop-color="#D2B271"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#3E6B45"/>
      <stop offset="1" stop-color="#6E9765"/>
    </linearGradient>
  </defs>
  <!-- leaves -->
  <path d="M31 44C25 27 35 11 55 4c2 18-7 33-24 40z" fill="url(#leaf)"/>
  <path d="M31 44C38 31 45 19 54 6" fill="none" stroke="#A9C49A" stroke-width="1" stroke-linecap="round"/>
  <path d="M28 46C16 41 11 30 14 18c10 5 16 15 14 28z" fill="url(#leaf)"/>
  <path d="M28 46C24 37 20 28 15 20" fill="none" stroke="#A9C49A" stroke-width=".9" stroke-linecap="round"/>
  <!-- iris, tucked under the upper lid -->
  <circle cx="70" cy="39" r="17" fill="url(#iris)"/>
  <circle cx="70" cy="39" r="7" fill="#142A1E"/>
  <circle cx="76" cy="33" r="2.8" fill="#FBF8F1"/>
  <!-- upper lid with sweeping tail -->
  <path d="M32 44C44 18 68 8 92 13c12 3 22 10 30 20-10-6-20-10-30-12-21-4-41 2-60 23z" fill="#E6DCC8"/>
  <!-- lower lid in gold, closing the almond at the outer corner -->
  <path d="M30 46c12 15 32 22 52 19 14-2 25-12 31-30-8 12-18 20-31 22-19 3-36-1-52-11z" fill="url(#gold)"/>
</svg>
